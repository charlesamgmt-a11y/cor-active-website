  <rect x="836" y="38" width="264" height="554" rx="38" fill="#8c5733" stroke="#e09457" stroke-width="2"/>
  <image x="844" y="46" width="248" height="538" preserveAspectRatio="xMidYMid meet" xlink:href="../dist/assets/product/home.png" clip-path="url(#screen)"/>
