  <defs>
    <radialGradient id="glow"><stop stop-color="#334f64" stop-opacity=".35"/><stop offset="1" stop-color="#050505" stop-opacity="0"/></radialGradient>
    <clipPath id="screen"><rect x="844" y="46" width="248" height="538" rx="30"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#050505"/>
  <ellipse cx="880" cy="310" rx="350" ry="300" fill="url(#glow)"/>
  <text x="74" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2" fill="#c2c9c9">COR ACTIVE · COMING SOON</text>
